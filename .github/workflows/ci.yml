name: CI

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser for UI tests'
        required: true
        default: 'Firefox'
        type: choice
        options:
          - Chrome
          - Firefox

jobs:
  api-tests:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore
      
      - name: Ensure TestResults directory exists
        shell: bash
        run: mkdir -p TestResults

      - name: Run API tests
        run: dotnet test --configuration Release --no-build --filter "Category=API" --logger "trx;LogFileName=api-results.trx" --logger "console;verbosity=detailed" --results-directory TestResults/ -- xUnit.ShowTestOutput=true

      - name: Locate generated log files
        shell: bash
        run: find . -type f -name "*.log"

      - name: Upload API logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-logs
          path: '**/Logs/*.log'
          if-no-files-found: warn
          retention-days: 7
 
      - name: Upload API test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: TestResults/api-results.trx

  ui-tests:
    needs: api-tests
    if: always()
    runs-on: windows-latest
    env:
      BROWSER: ${{ github.event.inputs.browser || 'Firefox' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Ensure directories exist
        shell: bash
        run: |
          mkdir -p TestResults/artifacts/debug
          mkdir -p TestResults/artifacts/Screenshots

      - name: Run UI tests
        run: dotnet test --configuration Release --no-build --filter "Category=UI" --logger "trx;LogFileName=ui-results.trx" --logger "console;verbosity=detailed" --results-directory TestResults/ -- xUnit.ShowTestOutput=true

      - name: Upload UI test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: TestResults/ui-results.trx

      - name: Upload debug captures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-debug-captures
          path: TestResults/artifacts/debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: TestResults/artifacts/Screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload UI logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-logs
          path: '**/Logs/*.log'
          if-no-files-found: ignore
          retention-days: 7
