name: CI

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser for UI tests'
        required: true
        default: 'Firefox'
        type: choice
        options:
          - Chrome
          - Firefox

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore
        
      - name: Ensure TestResults directory exists
        run: mkdir -p TestResults

      - name: Run API tests
        run: dotnet test --configuration Release --no-build --filter "Category=API" --logger "trx;LogFileName=api-results.trx" --results-directory TestResults/ -- xUnit.ShowTestOutput=true

      - name: Upload API logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-logs
          path: '**/Logs/*.log'
          if-no-files-found: warn
          retention-days: 7

      - name: Upload API test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: TestResults/api-results.trx

  ui-tests:
    needs: api-tests
    if: always()
    runs-on: ubuntu-latest
    env:
      BROWSER: ${{ github.event.inputs.browser || 'Firefox' }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Ensure directories exist
        run: |
          mkdir -p TestResults/artifacts/Screenshots

      - name: Run UI tests
        run: dotnet test --configuration Release --no-build --filter "Category=UI" --logger "trx;LogFileName=ui-results.trx" --results-directory TestResults/ -- xUnit.ShowTestOutput=true

      - name: Upload UI test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: TestResults/ui-results.trx

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: TestResults/artifacts/Screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload UI logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-logs
          path: '**/Logs/*.log'
          if-no-files-found: ignore
          retention-days: 7
