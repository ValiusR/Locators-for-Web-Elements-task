name: CI

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser for UI tests'
        required: true
        default: 'Chrome'
        type: choice
        options:
          - Chrome
          - Firefox

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run API tests
        run: dotnet test --configuration Release --no-build --filter "Category=API" --logger "trx;LogFileName=api-results.trx" --results-directory TestResults/

      - name: Upload API test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: TestResults/

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: Logs/
          retention-days: 7

  ui-tests:
    needs: api-tests
    if: always()
    runs-on: ubuntu-latest
    env:
      BROWSER: ${{ github.event.inputs.browser || 'Chrome' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run UI tests
        run: dotnet test --configuration Release --no-build --filter "Category=UI" --logger "trx;LogFileName=ui-results.trx" --results-directory TestResults/

      - name: Upload UI test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: TestResults/

      - name: Upload debug captures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-debug-captures
          path: TestResults/artifacts/debug/
          retention-days: 7

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: TestResults/artifacts/debug/Screenshots/**/*
          retention-days: 7

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: Logs/**/*
          retention-days: 7
